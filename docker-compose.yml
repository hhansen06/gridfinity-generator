services:
  gridfinity-generator:
    build: .
    image: gridfinity-generator
    ports:
      - "${GRIDFINITY_PORT:-8080}:8080"
    restart: unless-stopped
    environment:
      NGINX_ENTRYPOINT_QUIET_LOGS: "1"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
